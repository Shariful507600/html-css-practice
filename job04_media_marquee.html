<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Corner</title>
</head>
<body>
  <iframe src="https://rmpi.gov.bd/" height="200" width="300" title="Iframe Example"></iframe>

  <!-- audio ও video ফাইল আলাদা ফোল্ডারে রাখতে হবে -->
  <audio controls autoplay>
    <source src="audio/z.mp3" type="audio/mp3">
  </audio>

  <video width="300" height="200" controls autoplay>
    <source src="video/raj.mp4" type="video/mp4">
  </video>

  <marquee behavior="scroll" direction="left" loop="3">Notice: Exam starts next week!</marquee>
  <marquee behavior="alternate" direction="right">Welcome to our college</marquee>
  <marquee direction="up" height="80">Scrolling up text</marquee>
</body>
</html>
