<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Position</title>
  <link rel="stylesheet" href="job11_position_lab.css">
</head>
<body>
  <img src="kusum.jpg" alt="background">
  <h1>This is a heading (z-index: -1 এ ছবি পেছনে)</h1>

  <div class="sticky">I am sticky!</div>

  <div class="static">This div element has position: static;</div>

  <div class="relative">This div element has position: relative;
    <div class="absolute">This div element has position: absolute;</div>
  </div>

  <div class="fixed">This div element has position: fixed;</div>

  <div style="padding-bottom: 2000px">
    <p>Scroll করে sticky ও fixed এর কাজ দেখো।</p>
  </div>
</body>
</html>
