<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RMPI</title>
  <link rel="stylesheet" href="final_project.css">
</head>
<body>
  <header>
    <h1>Rajshahi Mohila Polytechnic Institute</h1>
  </header>

  <nav>
    <a href="#home">Home</a>
    <a href="#routine">Routine</a>
    <a href="#admission">Admission</a>
  </nav>

  <div class="main">
    <section id="home">
      <article>
        <h2>About Us</h2>
        <img src="college.jpg" alt="college" width="200">
        <p>A <b>Number One</b> Polytechnic Institute in Bangladesh.</p>
        <div class="box">Animated Box</div>
      </article>

      <article id="routine">
        <h2>Class Routine</h2>
        <table border="1">
          <tr><th>Day</th><th>Subject</th></tr>
          <tr><td>Sunday</td><td>Web Design</td></tr>
          <tr><td>Monday</td><td>Math</td></tr>
        </table>
      </article>

      <article id="admission">
        <h2>Admission Form</h2>
        <form action="/" method="post">
          <label for="name">Name:</label>
          <input type="text" id="name" required><br>
          <label for="mail">Email:</label>
          <input type="email" id="mail" required><br>
          <input type="submit" value="Submit">
        </form>
      </article>
    </section>

    <aside>
      <h3>Notice</h3>
      <marquee direction="up" height="100">Admission is open!</marquee>
    </aside>
  </div>

  <footer>&copy; 2026 RMPI</footer>
</body>
</html>
