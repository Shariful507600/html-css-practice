<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colors</title>
  <link rel="stylesheet" href="job08_colors_selectors.css">
</head>
<body>
  <div class="greenbox"></div>
  <div id="yellowbox"></div>

  <h1>Heading (CSS দিয়ে লাল)</h1>
  <p>This paragraph is gray.</p>

  <h3 style="color: Tomato;">Hello World</h3>
  <h3 style="border: 2px solid Tomato;">Border color</h3>
  <h3 style="background-color: rgb(255, 99, 71);">rgb(255, 99, 71)</h3>
  <h3 style="background-color: #ff6347;">#ff6347</h3>
  <h3 style="background-color: hsl(9, 100%, 64%);">hsl(9, 100%, 64%)</h3>
  <h3 style="background-color: rgba(255, 99, 71, 0.5);">rgba(255, 99, 71, 0.5)</h3>
  <h3 style="background-color: hsla(9, 100%, 64%, 0.5);">hsla(9, 100%, 64%, 0.5)</h3>
</body>
</html>
