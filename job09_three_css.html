<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inline, Internal, External CSS</title>

  <!-- (গ) External CSS: job09_style.css ফাইল একই ফোল্ডারে রাখো -->
  <link rel="stylesheet" href="job09_style.css">

  <!-- (খ) Internal CSS -->
  <style>
    h2 { color: red; font-size: 36px; }
  </style>
</head>
<body>
  <!-- (ক) Inline CSS -->
  <h1 style="color: blue;">Inline CSS: Rajshahi Mohila Polytechnic Institute</h1>
  <p style="text-align: justify;">Inline CSS: It's a Number One Polytechnic Institute in Bangladesh.</p>

  <h2>Internal CSS: Rajshahi Mohila Polytechnic Institute</h2>

  <h3>External CSS: Rajshahi Mohila Polytechnic Institute</h3>
  <p class="ext">External CSS: It's a Number One Polytechnic Institute in Bangladesh.</p>
</body>
</html>
